          <div>
            <span class="text-[10px] font-mono-num uppercase px-2 py-0.5 rounded-full" style="background-color: var(--brand-brass-soft); color: var(--brand-brass);">Guía del Sommelier de Taza</span>
            <h3 class="font-editorial text-2xl font-bold mt-1">Protocolo de Servicio: ¿Solo, con Leche o con Syrup?</h3>
          </div>
          <button onclick="switchTab('mixology')" class="btn-parchment px-3 py-1.5 text-xs">Abrir Laboratorio de Syrups &amp; Cold Brew →</button>
        </div>




        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
          <!-- Opción 1: Solo en Agua -->
          <div class="parchment-box p-4 flex flex-col justify-between gap-2 border-t-4" style="border-top-color: ${bio.service.solo.color};">
            <div>
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-editorial text-lg font-bold">1. Solo (Infusión Pura)</span>
                <span class="text-[10px] font-mono-num font-bold px-2 py-0.5 rounded-full" style="background-color: var(--bg-card); color: ${bio.service.solo.color};">${bio.service.solo.status}</span>
              </div>
              <p class="mt-2 leading-relaxed" style="color: var(--text-secondary);">${bio.service.solo.note}</p>
            </div>
            <div class="pt-2 border-t font-mono-num text-[11px]" style="border-color: var(--border-herbarium); color: var(--text-muted);">
              Ratio sugerido: 2.5 g / 250 ml • ${an.optTempC}°C
            </div>
          </div>




          <!-- Opción 2: Con Leche / Bebida Vegetal -->
          <div class="parchment-box p-4 flex flex-col justify-between gap-2 border-t-4" style="border-top-color: ${bio.service.milk.color};">
            <div>
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-editorial text-lg font-bold">2. Con Leche o Vegetal</span>
                <span class="text-[10px] font-mono-num font-bold px-2 py-0.5 rounded-full" style="background-color: var(--bg-card); color: ${bio.service.milk.color};">${bio.service.milk.status}</span>
              </div>
              <div class="font-semibold mt-1" style="color: var(--brand-clay);">${bio.service.milk.type}</div>
              <p class="mt-1.5 leading-relaxed" style="color: var(--text-secondary);">${bio.service.milk.note}</p>
            </div>
            <div class="pt-2 border-t font-mono-num text-[11px]" style="border-color: var(--border-herbarium); color: var(--text-muted);">
              Base Latte: 5 g / 150 ml agua + 100 ml leche
            </div>
          </div>




          <!-- Opción 3: Con Syrup o Miel -->
          <div class="parchment-box p-4 flex flex-col justify-between gap-2 border-t-4" style="border-top-color: ${bio.service.syrup.color};">
            <div>
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-editorial text-lg font-bold">3. Con Syrup o Miel</span>
                <span class="text-[10px] font-mono-num font-bold px-2 py-0.5 rounded-full" style="background-color: var(--bg-card); color: ${bio.service.syrup.color};">${bio.service.syrup.status}</span>
              </div>
              <div class="font-semibold mt-1" style="color: var(--brand-matcha);">${bio.service.syrup.rec}</div>
              <p class="mt-1.5 leading-relaxed" style="color: var(--text-secondary);">${bio.service.syrup.note}</p>
            </div>
            <div class="pt-2 border-t font-mono-num text-[11px]" style="border-color: var(--border-herbarium); color: var(--text-muted);">
              Dosificación barra: 8–15 ml por taza/copa
            </div>
          </div>
        </div>
      </div>




      <!-- Fila 3: Inspector Individual de los 200 Botánicos -->
      <div class="atelier-card p-5">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div>
            <h3 class="font-editorial text-xl font-bold">Inspector Fitoquímico Individual (${state.materials.length} Botánicos)</h3>
            <p class="text-xs" style="color: var(--text-secondary);">Analizando: <strong style="color: var(--brand-matcha);">[${escapeHtml(inspMat.categoria)}] ${escapeHtml(inspMat.nombre)}</strong></p>
          </div>
          <div id="bioBotanicalCombobox" class="relative flex items-center gap-2 flex-wrap w-full sm:w-auto flex-1 max-w-lg justify-end">
            <div class="relative flex-1 min-w-[220px]">
              <svg class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--text-muted);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text"
                id="bioBotanicalSearchInput"
                autocomplete="off"
                value="${escapeHtml(state.bioBotanicalSearch || '')}"
                onfocus="openBioBotanicalDropdown()"
                oninput="handleBioBotanicalInput(this.value)"
                onkeydown="handleBioBotanicalKeydown(event)"
                placeholder="Buscar botánico para inspeccionar..."
                class="atelier-input w-full pl-8 pr-7 py-1.5 text-xs" />
              <button type="button"
                id="bioBotanicalClearBtn"
                onmousedown="event.preventDefault(); clearBioBotanicalSearch();"
                class="${state.bioBotanicalSearch ? '' : 'hidden'} absolute right-2 top-1/2 -translate-y-1/2 text-sm font-bold px-1 rounded hover:opacity-75"
                style="color: var(--text-muted);">×</button>
              <div id="bioBotanicalDropdown"
                class="hidden absolute left-0 right-0 bottom-full mb-1.5 z-40 atelier-card shadow-2xl border overflow-hidden"
                style="border-color: var(--border-strong);">
              </div>
            </div>
            <button onclick="addSpecificBotanicalToBlend('${inspMat.id}')" class="btn-matcha px-3 py-1.5 text-xs shrink-0">+ Añadir a Fórmula</button>
          </div>
        </div>




        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 text-center font-mono-num text-xs">
          <div class="parchment-box p-2.5"><div class="text-[10px]" style="color: var(--text-muted);">DIGESTIVO</div><div class="text-base font-bold" style="color: var(--brand-matcha);">${inspBio.digestivo.toFixed(1)}/10</div></div>
          <div class="parchment-box p-2.5"><div class="text-[10px]" style="color: var(--text-muted);">ANTIOXIDANTE</div><div class="text-base font-bold" style="color: #3B7A57;">${inspBio.antioxidante.toFixed(1)}/10</div></div>
          <div class="parchment-box p-2.5"><div class="text-[10px]" style="color: var(--text-muted);">TERMOGÉNICO</div><div class="text-base font-bold" style="color: var(--brand-clay);">${inspBio.termogenico.toFixed(1)}/10</div></div>
          <div class="parchment-box p-2.5"><div class="text-[10px]" style="color: var(--text-muted);">INMUNOLÓGICO</div><div class="text-base font-bold" style="color: var(--brand-brass);">${inspBio.inmunologico.toFixed(1)}/10</div></div>
          <div class="parchment-box p-2.5"><div class="text-[10px]" style="color: var(--text-muted);">RELAJANTE</div><div class="text-base font-bold" style="color: #6E648C;">${inspBio.relajante.toFixed(1)}/10</div></div>
        </div>
      </div>




    </div>
  `;
}




function getFilteredBioBotanicals() {
  const q = normalizeSearchStr(state.bioBotanicalSearch || '');
  if (!q) return state.materials;
  return state.materials.filter(m =>
    normalizeSearchStr(m.nombre).includes(q) ||
    normalizeSearchStr(m.categoria).includes(q) ||
    normalizeSearchStr(m.origen || '').includes(q) ||
    m.notas.some(n => normalizeSearchStr(n).includes(q))
  );
}


function openBioBotanicalDropdown() {
  const drop = document.getElementById('bioBotanicalDropdown');
  if (!drop) return;
  renderBioBotanicalDropdown();
  drop.classList.remove('hidden');
}


function handleBioBotanicalInput(val) {
  state.bioBotanicalSearch = val;
  bioHighlightIdx = 0;
  const clearBtn = document.getElementById('bioBotanicalClearBtn');
  if (clearBtn) {
    if (val) clearBtn.classList.remove('hidden');
    else clearBtn.classList.add('hidden');
  }
  openBioBotanicalDropdown();
}


function clearBioBotanicalSearch() {
  state.bioBotanicalSearch = '';
  bioHighlightIdx = 0;
  const inp = document.getElementById('bioBotanicalSearchInput');
  if (inp) {
    inp.value = '';
    inp.focus();
  }
  const clearBtn = document.getElementById('bioBotanicalClearBtn');
  if (clearBtn) clearBtn.classList.add('hidden');
  openBioBotanicalDropdown();
}


function renderBioBotanicalDropdown() {
  const drop = document.getElementById('bioBotanicalDropdown');
  if (!drop) return;
  const visible = getFilteredBioBotanicals().slice(0, 40);
  if (bioHighlightIdx >= visible.length) bioHighlightIdx = Math.max(0, visible.length - 1);
  if (visible.length === 0) {
    drop.innerHTML = `<div class="p-3 text-center text-xs" style="color: var(--text-muted);">Sin coincidencias en el herbario.</div>`;
    return;
  }
  drop.innerHTML = `
    <div class="max-h-60 overflow-y-auto divide-y" style="border-color: var(--border-herbarium);">
      ${visible.map((m, idx) => `
        <div data-bio-opt-idx="${idx}"
          onmousedown="event.preventDefault(); selectBioBotanical('${m.id}');"
          onmouseenter="bioHighlightIdx=${idx};"
          class="px-3 py-2 cursor-pointer text-xs flex items-center justify-between gap-2"
          style="${idx === bioHighlightIdx ? 'background-color: var(--brand-matcha-soft);' : ''}">
          <div class="truncate">
            <span class="text-[10px] font-mono-num px-1.5 py-0.2 rounded mr-1" style="background-color: var(--bg-parchment); color: var(--brand-clay);">${escapeHtml(m.categoria)}</span>
            <span class="font-semibold">${escapeHtml(m.nombre)}</span>
          </div>
          <span class="font-mono-num text-[10px] shrink-0" style="color: var(--text-muted);">${m.teinaMgG} mg/g</span>
        </div>
      `).join('')}
    </div>
  `;
}


function handleBioBotanicalKeydown(e) {
  const drop = document.getElementById('bioBotanicalDropdown');
  const visible = getFilteredBioBotanicals().slice(0, 40);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (drop && drop.classList.contains('hidden')) { openBioBotanicalDropdown(); return; }
    if (visible.length > 0) { bioHighlightIdx = (bioHighlightIdx + 1) % visible.length; renderBioBotanicalDropdown(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (visible.length > 0) { bioHighlightIdx = (bioHighlightIdx - 1 + visible.length) % visible.length; renderBioBotanicalDropdown(); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const chosen = visible[bioHighlightIdx] || visible[0];
    if (chosen) selectBioBotanical(chosen.id);
  } else if (e.key === 'Escape') {
    if (drop) drop.classList.add('hidden');
  }
}


function selectBioBotanical(matId) {
  state.bioInspectMatId = matId;
  state.bioBotanicalSearch = '';
  bioHighlightIdx = 0;
  saveState();
  renderCurrentTab();
}


function addSpecificBotanicalToBlend(matId) {
  const b = getActiveBlend();
  if (!b) return;
  const ex = b.ingredientes.find(i => i.materialId === matId);
  if (ex) {
    ex.pct = Number((ex.pct + 5).toFixed(2));
  } else {
    b.ingredientes.push({ materialId: matId, pct: 10 });
  }
  saveState();
  switchTab('lab');
  showToast('Botánico añadido a la Mesa de Blending.');
}




window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
