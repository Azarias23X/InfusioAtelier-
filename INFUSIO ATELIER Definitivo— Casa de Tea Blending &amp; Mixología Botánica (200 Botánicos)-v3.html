<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFUSIO ATELIER — Casa de Tea Blending & Mixología Botánica</title>
  <!-- Tipografías Editoriales de Atelier Botánico y Precisión de Laboratorio -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* ========================================================================
       SISTEMA DE DISEÑO — ATELIER BOTÁNICO & CASA DE CEREMONIA
       ======================================================================== */
    :root {
      /* Modo Día: Papel Washi & Ceremonia */
      --bg-app: #F6F2EA;
      --bg-card: #FCF9F3;
      --bg-parchment: #EFE8DA;
      --bg-input: #FAF7F0;
      --border-herbarium: #DFD5C5;
      --border-strong: #C9BBA5;




      --text-primary: #231C16;     /* Tinta Pu-erh oscuro */
      --text-secondary: #5C4E41;   /* Corteza infusionada */
      --text-muted: #8C7C6B;       /* Hierba seca */




      --brand-matcha: #2E5233;     /* Verde Ceremonial Matcha / Gyokuro */
      --brand-matcha-hover: #213D25;
      --brand-matcha-soft: #E4EDE3;




      --brand-clay: #A65A38;       /* Terracota Arcilla Yixing / Ámbar Darjeeling */
      --brand-clay-soft: #F5E7DF;




      --brand-brass: #B58438;      /* Miel de Oolong Tostado / Latón */
      --brand-brass-soft: rgba(181, 132, 56, 0.14);




      --shadow-atelier: 0 4px 20px rgba(42, 31, 21, 0.05);
      --danger: #A8382B;
      --warning: #B57424;
    }




    html.dark {
      /* Modo Noche: Salón Nocturno Pu-erh & Arcilla Yixing */
      --bg-app: #171310;
      --bg-card: #211B16;
      --bg-parchment: #2A221C;
      --bg-input: #1B1612;
      --border-herbarium: #3B3128;
      --border-strong: #524438;




      --text-primary: #EFE8DC;     /* Papel de arroz */
      --text-secondary: #B8AA99;
      --text-muted: #857767;




      --brand-matcha: #7FA87C;     /* Jade Celadón */
      --brand-matcha-hover: #92BA8F;
      --brand-matcha-soft: rgba(127, 168, 124, 0.15);




      --brand-clay: #D48B59;       /* Licor Ámbar */
      --brand-clay-soft: rgba(212, 139, 89, 0.16);




      --brand-brass: #C99A4E;      /* Bronce envejecido cálido */
      --brand-brass-soft: rgba(201, 154, 78, 0.15);




      --shadow-atelier: 0 6px 24px rgba(0, 0, 0, 0.35);
      --danger: #D96554;
      --warning: #D99B43;
    }




    * {
      box-sizing: border-box;
    }




    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      position: relative;
    }




    /* Textura sutil de fibra de Papel Washi mediante filtro SVG feTurbulence */
    .washi-texture-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='washiNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23washiNoise)'/%3E%3C/svg%3E");
    }




    .font-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }




    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }




    /* Tarjeta de Porcelana Cálida / Laca Oscura */
    .atelier-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-herbarium);
      border-radius: 1rem;
      box-shadow: var(--shadow-atelier);
      transition: border-color 0.2s ease, background-color 0.3s ease;
    }




    /* Panel Interno de Pergamino Infusionado */
    .parchment-box {
      background-color: var(--bg-parchment);
      border: 1px solid var(--border-herbarium);
      border-radius: 0.8rem;
    }




    /* Campos de Formulario de Herbario */
    .atelier-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-herbarium);
      color: var(--text-primary);
      border-radius: 0.6rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .atelier-input:focus {
      outline: none;
      border-color: var(--brand-matcha);
      box-shadow: 0 0 0 3px var(--brand-matcha-soft);
    }




    /* Botones Artesanales */
    .btn-matcha {
      background-color: var(--brand-matcha);
      color: #FCF9F3;
      font-weight: 600;
      border-radius: 0.65rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    html.dark .btn-matcha {
      color: #171310;
      font-weight: 700;
    }
    .btn-matcha:hover {
      background-color: var(--brand-matcha-hover);
    }
    .btn-matcha:active {
      transform: scale(0.98);
    }




    .btn-clay {
      background-color: var(--brand-clay);
      color: #FCF9F3;
      font-weight: 600;
      border-radius: 0.65rem;
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    html.dark .btn-clay {
      color: #171310;
      font-weight: 700;
    }
    .btn-clay:hover {
      filter: brightness(1.08);
    }




    .btn-parchment {
      background-color: var(--bg-parchment);
      border: 1px solid var(--border-herbarium);
      color: var(--text-primary);
      border-radius: 0.65rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-parchment:hover {
      border-color: var(--brand-brass);
    }




    /* Pestañas estilo Fichas de Archivo de Botica / Herbario */
    .herbarium-tab {
      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 0.75rem 0.75rem 0 0;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .herbarium-tab:hover {
      color: var(--text-primary);
      background-color: var(--bg-parchment);
    }
    .herbarium-tab.active {
      background-color: var(--bg-app);
      border-color: var(--border-herbarium);
      color: var(--brand-matcha);
      font-weight: 700;
      box-shadow: 0 -2px 10px rgba(42, 31, 21, 0.03);
    }
    .herbarium-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--bg-app);
    }




    /* Sliders Personalizados: Barra de Latón y Perilla de Arcilla Yixing */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      background: linear-gradient(90deg, var(--brand-brass-soft), var(--brand-brass));
      border: 1px solid var(--border-herbarium);
      border-radius: 999px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--brand-clay);
      border: 2px solid var(--bg-card);
      box-shadow: 0 2px 5px rgba(35, 28, 22, 0.28);
      transition: transform 0.12s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--brand-clay);
      border: 2px solid var(--bg-card);
      box-shadow: 0 2px 5px rgba(35, 28, 22, 0.28);
    }




    /* Animación suave de vapor ascendente sobre el cuenco de porcelana */
    @keyframes steamRise {
      0% {
        transform: translateY(4px) scaleX(0.95);
        opacity: 0;
      }
      40% {
        opacity: 0.45;
      }
      80% {
        opacity: 0.2;
      }
      100% {
        transform: translateY(-16px) scaleX(1.08);
        opacity: 0;
      }
    }
    .steam-line-1 {
      animation: steamRise 3.8s ease-in-out infinite;
    }
    .steam-line-2 {
      animation: steamRise 4.4s ease-in-out 1.2s infinite;
    }
    .steam-line-3 {
      animation: steamRise 3.5s ease-in-out 2.1s infinite;
    }




    /* Scrollbar sutil de pergamino */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }




    /* Vista de Impresión de Ficha Técnica */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #1A1510 !important;
      }
      .no-print, .washi-texture-overlay, .botanical-watermark {
        display: none !important;
      }
      .atelier-card, .parchment-box {
        border: 1px solid #C8BFA8 !important;
        background: #FFFFFF !important;
        box-shadow: none !important;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">




  <!-- Textura de fibra de Papel Washi -->
  <div class="washi-texture-overlay" aria-hidden="true"></div>




  <!-- Marca de agua botánica delicada (Rama de Camellia sinensis) -->
  <svg class="botanical-watermark fixed bottom-0 right-0 w-72 h-72 pointer-events-none opacity-[0.045] dark:opacity-[0.04] z-0" viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
    <path d="M280 290 C230 220, 175 165, 95 95" />
    <path d="M210 215 C175 215, 145 195, 138 172 C162 170, 190 185, 210 215 Z" />
    <path d="M175 178 C178 142, 198 112, 222 106 C222 132, 205 160, 175 178 Z" />
    <path d="M135 135 C102 138, 74 122, 66 98 C90 95, 118 110, 135 135 Z" />
    <path d="M95 95 C88 72, 72 56, 56 50 C62 68, 76 85, 95 95 Z" />
  </svg>




  <!-- ======================================================================
       CABECERA DEL ATELIER BOTÁNICO
       ====================================================================== -->
  <header class="sticky top-0 z-40 border-b no-print" style="background-color: var(--bg-card); border-color: var(--border-herbarium);">
    <div class="max-w-[1600px] mx-auto px-3 sm:px-6 pt-3 pb-2.5 flex flex-wrap items-center justify-between gap-3">




      <!-- Emblema Artesanal: Dos Hojas y un Brote (Camellia sinensis) -->
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-full flex items-center justify-center border relative" style="background-color: var(--brand-matcha-soft); border-color: var(--brand-matcha);">
          <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--brand-matcha);">
            <!-- Tallo central -->
            <path d="M16 28 C16 21, 16 14, 16 6" stroke-linecap="round"/>
            <!-- Brote apical (Pekoe) -->
            <path d="M16 5 C14.2 8.5, 14.5 11.5, 16 13.5 C17.5 11.5, 17.8 8.5, 16 5 Z" fill="currentColor" fill-opacity="0.18"/>
            <!-- Hoja izquierda -->
            <path d="M16 18 C11 18, 6.5 15, 5.5 11 C9.5 10.5, 14 13, 16 18 Z" fill="currentColor" fill-opacity="0.12"/>
            <path d="M16 18 L8.5 13" stroke-width="1"/>
            <!-- Hoja derecha -->
            <path d="M16 21 C21 21, 25.5 18, 26.5 14 C22.5 13.5, 18 16, 16 21 Z" fill="currentColor" fill-opacity="0.12"/>
            <path d="M16 21 L23.5 16" stroke-width="1"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-editorial text-xl sm:text-2xl font-bold tracking-wide leading-none">INFUSIO ATELIER</h1>
            <span class="text-[10px] font-mono-num uppercase px-2 py-0.5 rounded-full border font-medium hidden sm:inline-block"
              style="background-color: var(--brand-clay-soft); border-color: var(--brand-clay); color: var(--brand-clay);">
              Herbario &amp; Barra
            </span>
          </div>
          <p class="font-editorial italic text-xs sm:text-sm mt-0.5" style="color: var(--text-secondary);">
            Casa de Tea Blending, Análisis Sensorial &amp; Mixología Botánica (<span class="italic">Camellia sinensis</span>)
          </p>
        </div>
      </div>




      <!-- Selector de Blend de Autor Activo -->
      <div class="flex items-center gap-1.5 flex-1 max-w-md mx-1">
        <span class="font-editorial italic text-sm hidden md:inline whitespace-nowrap" style="color: var(--text-secondary);">Fórmula en Mesa:</span>
        <select id="globalBlendSelect" onchange="selectBlend(this.value)" class="atelier-input px-3 py-1.5 text-xs sm:text-sm font-semibold w-full truncate"></select>
        <button onclick="openDeleteBlendModal()" title="Eliminar composición activa" class="btn-parchment p-1.5 shrink-0 hover:border-red-500/60 transition-colors" style="color: var(--danger);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>




      <!-- Controles de Atelier: Moneda, CSV, Backup, Ficha Impresa, Conmutador Día/Noche -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <select id="currencySelect" onchange="changeCurrency(this.value)" title="Divisa del Atelier" class="atelier-input px-2 py-1.5 text-xs font-mono-num">
          <option value="USD">USD $</option>
          <option value="ARS">ARS $</option>
          <option value="EUR">EUR €</option>
          <option value="MXN">MXN $</option>
        </select>




        <button onclick="exportCSV()" title="Exportar Fórmula Activa en CSV" class="btn-parchment px-2.5 py-1.5 text-xs flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
          <span class="hidden lg:inline">CSV</span>
        </button>




        <button onclick="exportJSON()" title="Guardar Archivo del Atelier (JSON)" class="btn-parchment px-2.5 py-1.5 text-xs flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="hidden lg:inline">Respaldo</span>
        </button>




        <label title="Restaurar Archivo JSON" class="btn-parchment px-2.5 py-1.5 text-xs flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="hidden lg:inline">Importar</span>
          <input type="file" id="importJsonInput" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>




        <button onclick="window.print()" title="Imprimir Ficha Técnica de Herbario" class="btn-parchment px-2.5 py-1.5 text-xs flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span class="hidden md:inline">Ficha</span>
        </button>




        <!-- Conmutador Papel Washi / Salón Nocturno Pu-erh -->
        <button onclick="toggleTheme()" id="themeToggleBtn" title="Alternar Papel Washi / Salón Nocturno Pu-erh" class="btn-parchment px-2.5 py-1.5 text-xs flex items-center gap-1.5"></button>
      </div>
    </div>




    <!-- PESTAÑAS DE ARCHIVO DE HERBARIO CON ÍCONOS BOTÁNICOS SVG -->
    <nav class="max-w-[1600px] mx-auto px-3 sm:px-6 pt-1.5 flex items-end gap-1 sm:gap-2 overflow-x-auto">
      <button onclick="switchTab('lab')" data-tab="lab" class="herbarium-tab active py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 3v18M5 8h14M7 8l-2 5h4l-2-5zm10 0l-2 5h4l-2-5z"/>
        </svg>
        <span>01. Mesa de Blending</span>
      </button>




      <button onclick="switchTab('sensory')" data-tab="sensory" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 6.36 15.36L12 12V3z"/>
        </svg>
        <span>02. Perfil Sensorial &amp; Sinestesia</span>
      </button>




      <button onclick="switchTab('library')" data-tab="library" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 21C7 17 4 12 6 6c6-2 11 1 15 6-3 5-6 8-9 9z"/><path d="M6 6l12 12"/>
        </svg>
        <span>03. Biblioteca Botánica</span>
      </button>




      <button onclick="switchTab('mixology')" data-tab="mixology" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M5 4h14l-7 9v7M8 20h8M9 8h6"/>
        </svg>
        <span>04. Mixología &amp; Cold Lab</span>
      </button>




      <button onclick="switchTab('cupping')" data-tab="cupping" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 11h16c0 5-3.5 8-8 8s-8-3-8-8z"/><path d="M9 5c0 1.5 1 2 1 3.5M14 4c0 1.5 1 2 1 3.5"/>
        </svg>
        <span>05. Protocolo de Cata</span>
      </button>




      <button onclick="switchTab('production')" data-tab="production" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>
        </svg>
        <span>06. Costos, Etiqueta &amp; Producción</span>
      </button>




      <button onclick="switchTab('alchemy')" data-tab="alchemy" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>
        </svg>
        <span>07. Alquimia &amp; Curvas</span>
      </button>




      <button onclick="switchTab('treatise')" data-tab="treatise" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>08. Tratado Master</span>
      </button>




      <button onclick="switchTab('bioeffects')" data-tab="bioeffects" class="herbarium-tab py-2 px-3 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6-.7.5-1.2 1.2-1.4 2H9.7c-.2-.8-.7-1.5-1.4-2A7 7 0 0 1 12 2z"/><path d="M9 21h6M10 18h4"/>
        </svg>
        <span>09. Bio-Efectos &amp; Servicio</span>
      </button>

function normalizeSearchStr(str) {
  return String(str || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}


function initApp() {
  loadState();
  applyTheme(state.theme);
  document.getElementById('currencySelect').value = state.currency;
  renderGlobalBlendSelect();
  switchTab(state.activeTab || 'lab');


  document.addEventListener('mousedown', (e) => {
    const labBox = document.getElementById('labBotanicalCombobox');
    const labDrop = document.getElementById('labBotanicalDropdown');
    if (labBox && labDrop && !labBox.contains(e.target)) {
      labDrop.classList.add('hidden');
    }
    const bioBox = document.getElementById('bioBotanicalCombobox');
    const bioDrop = document.getElementById('bioBotanicalDropdown');
    if (bioBox && bioDrop && !bioBox.contains(e.target)) {
      bioDrop.classList.add('hidden');
    }
  });
}




function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
      if (!state.materials || state.materials.length === 0) state.materials = JSON.parse(JSON.stringify(INITIAL_MATERIALS));
      if (!state.blends || state.blends.length === 0) state.blends = JSON.parse(JSON.stringify(INITIAL_BLENDS));
      if (!state.cocktails) state.cocktails = JSON.parse(JSON.stringify(INITIAL_COCKTAILS));
      state.chords = JSON.parse(JSON.stringify(INITIAL_CHORDS));
      if (!state.chords || state.chords.length === 0) state.chords = JSON.parse(JSON.stringify(INITIAL_CHORDS));
      if (!state.productionLogs) state.productionLogs = [];
      if (!state.gongfuDurations || state.gongfuDurations.length !== 6) state.gongfuDurations = [15, 25, 40, 60, 90, 120];
      if (!state.gongfuNotes || state.gongfuNotes.length !== 6) state.gongfuNotes = ['', '', '', '', '', ''];
    } else {
      state.materials = JSON.parse(JSON.stringify(INITIAL_MATERIALS));
      state.blends = JSON.parse(JSON.stringify(INITIAL_BLENDS));
      state.cocktails = JSON.parse(JSON.stringify(INITIAL_COCKTAILS));
      state.chords = JSON.parse(JSON.stringify(INITIAL_CHORDS));
      saveState();
    }
  } catch (e) {
    console.error('Error cargando archivo del Atelier:', e);
    state.materials = JSON.parse(JSON.stringify(INITIAL_MATERIALS));
    state.blends = JSON.parse(JSON.stringify(INITIAL_BLENDS));
  }
}




function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Error guardando en localStorage:', e);
  }
}




function getActiveBlend() {
  let b = state.blends.find(x => x.id === state.activeBlendId);
  if (!b && state.blends.length > 0) {
    b = state.blends[0];
    state.activeBlendId = b.id;
  }
  return b;
}




function getMaterial(id) {
  return state.materials.find(m => m.id === id);
}




function formatMoney(val) {
  const sym = state.currency === 'EUR' ? '€' : '$';
  return `${sym}${Number(val || 0).toFixed(2)}`;
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(state.theme);
  saveState();
}




function applyTheme(theme) {
  const html = document.documentElement;
  if (theme === 'dark') html.classList.add('dark');
  else html.classList.remove('dark');




  const btn = document.getElementById('themeToggleBtn');
  if (btn) {
    btn.innerHTML = theme === 'dark'
      ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" style="color: var(--brand-brass);"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg><span class="hidden sm:inline font-editorial italic text-sm">Papel Washi</span>`
      : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" style="color: var(--brand-clay);"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="hidden sm:inline font-editorial italic text-sm">Salón Pu-erh</span>`;
  }
}




function changeCurrency(curr) {
  state.currency = curr;
  saveState();
  renderCurrentTab();
  showToast(`Divisa del Atelier actualizada a ${curr}`);
}




function switchTab(tab) {
  state.activeTab = tab;
  saveState();
  document.querySelectorAll('.herbarium-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  renderCurrentTab();
}




function renderCurrentTab() {
  const container = document.getElementById('appContainer');
  if (!container) return;
  switch (state.activeTab) {
    case 'lab': renderLabModule(container); break;
    case 'sensory': renderSensoryModule(container); break;
    case 'library': renderLibraryModule(container); break;
    case 'mixology': renderMixologyModule(container); break;
    case 'cupping': renderCuppingModule(container); break;
    case 'production': renderProductionModule(container); break;
    case 'alchemy': renderAlchemyModule(container); break;
    case 'treatise': renderTreatiseModule(container); break;
    case 'bioeffects': renderBioEffectsModule(container); break;
  }
}




function renderGlobalBlendSelect() {
  const sel = document.getElementById('globalBlendSelect');
  if (!sel) return;
  sel.innerHTML = state.blends.map(b =>
    `<option value="${b.id}" ${b.id === state.activeBlendId ? 'selected' : ''}>${b.codigo} — ${b.nombre}</option>`
  ).join('');
}




function selectBlend(id) {
  state.activeBlendId = id;
  state.compareVersionIdx = null;
  saveState();
  renderGlobalBlendSelect();
  renderCurrentTab();
}




function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  const borderCol = type === 'error' ? 'var(--danger)' : type === 'warn' ? 'var(--warning)' : 'var(--brand-matcha)';
  el.className = 'atelier-card px-4 py-2.5 text-xs font-medium shadow-xl flex items-center gap-2 pointer-events-auto transition-all';
  el.style.borderLeft = `4px solid ${borderCol}`;
  el.innerHTML = `<span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

function analyzeBlend(blend) {
  let totalPct = 0;
  let weightedTemp = 0;
  let weightedTime = 0;
  let teinaMgPorGramo = 0;
  let costoKgBlend = 0;
  let minTemp = 999, maxTemp = 0;
  let minTempMat = '', maxTempMat = '';
  let minDens = 999, maxDens = 0;
  let minDensMat = '', maxDensMat = '';
  const essentialAlerts = [];
  const alergenosSet = new Set();




  const sensorySum = {};
  SENSORY_AXES.forEach(a => sensorySum[a.key] = 0);




  const enrichedItems = blend.ingredientes.map((item, idx) => {
    const mat = getMaterial(item.materialId);
    const pct = Number(item.pct) || 0;
    const gramos = (pct / 100) * (Number(blend.batchSizeG) || 0);
    totalPct += pct;




    if (mat && pct > 0) {
      weightedTemp += mat.tempC * pct;
      weightedTime += mat.tiempoSeg * pct;
      teinaMgPorGramo += mat.teinaMgG * (pct / 100);
      costoKgBlend += mat.costoKg * (pct / 100);




      if (mat.tempC < minTemp) { minTemp = mat.tempC; minTempMat = mat.nombre; }
      if (mat.tempC > maxTemp) { maxTemp = mat.tempC; maxTempMat = mat.nombre; }




      if (mat.densidad < minDens) { minDens = mat.densidad; minDensMat = mat.nombre; }
      if (mat.densidad > maxDens) { maxDens = mat.densidad; maxDensMat = mat.nombre; }




      if (mat.dosisMaxPct && pct > mat.dosisMaxPct) {
        essentialAlerts.push(`${mat.nombre} dosificado al ${pct.toFixed(2)}% (límite aromático sugerido: ${mat.dosisMaxPct}%).`);
      }




      if (mat.alergeno) alergenosSet.add(mat.alergeno);




      SENSORY_AXES.forEach(a => {
        sensorySum[a.key] += (mat.perfilSensorial[a.key] || 0) * (pct / 100);
      });
    }




    return { ...item, idx, mat, gramos };
  });




  const normFactor = totalPct > 0 ? (100 / totalPct) : 0;
  const optTempC = totalPct > 0 ? Math.round(weightedTemp / totalPct) : 85;
  const optTimeSeg = totalPct > 0 ? Math.round(weightedTime / totalPct) : 180;




  const sensoryProfile = {};
  SENSORY_AXES.forEach(a => {
    sensoryProfile[a.key] = totalPct > 0 ? Math.min(10, sensorySum[a.key] * normFactor) : 0;
  });




  // Teína por taza de 250 ml (2.5 g de hebra)
  const teinaPorTaza = teinaMgPorGramo * 2.5;
  let teinaNivel = 'Libre de Teína (0 mg)';
  let teinaBadgeColor = 'var(--brand-matcha)';
  if (teinaPorTaza > 0 && teinaPorTaza < 15) { teinaNivel = 'Estímulo Suave'; teinaBadgeColor = 'var(--brand-matcha)'; }
  else if (teinaPorTaza >= 15 && teinaPorTaza < 35) { teinaNivel = 'Estímulo Moderado'; teinaBadgeColor = 'var(--brand-brass)'; }
  else if (teinaPorTaza >= 35) { teinaNivel = 'Estímulo Alto'; teinaBadgeColor = 'var(--brand-clay)'; }




  const deltaT = maxTemp > 0 ? (maxTemp - minTemp) : 0;
  const hasThermalConflict = deltaT >= 15;




  const stratRatio = (minDens < 999 && minDens > 0) ? (maxDens / minDens) : 1;
  const hasStratConflict = stratRatio > 3.5;




  return {
    items: enrichedItems,
    totalPct,
    optTempC,
    optTimeSeg,
    teinaPorTaza,
    teinaNivel,
    teinaBadgeColor,
    costoKgBlend,
    costo100g: costoKgBlend / 10,
    deltaT,
    minTemp,
    maxTemp,
    minTempMat,
    maxTempMat,
    hasThermalConflict,
    stratRatio,
    minDens,
    maxDens,
    minDensMat,
    maxDensMat,
    hasStratConflict,
    essentialAlerts,
    alergenos: Array.from(alergenosSet),
    sensoryProfile
  };
}

        <!-- Motor de Diagnóstico Técnico en Vivo -->

                        ${isComparing ? 'Ocultar Δ' : 'Comparar'}

                      <button onclick="restoreFormulaVersion(${realIdx})" class="px-2 py-0.5 rounded text-[11px] border" style="border-color: var(--border-herbarium); color: var(--text-primary);">

                  <p class="mt-1 text-[11px] font-editorial italic" style="color: var(--text-secondary);">${escapeHtml(v.nota)}</p>
                  ${isComparing ? renderVersionDiff(blend, v) : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>




      </div>
    </div>
  `;
}




function renderVersionDiff(currentBlend, snapshot) {
  const allIds = new Set([
    ...currentBlend.ingredientes.map(i => i.materialId),
    ...snapshot.ingredientes.map(i => i.materialId)
  ]);
  const rows = [];
  allIds.forEach(id => {
    const mat = getMaterial(id);
    if (!mat) return;
    const curPct = (currentBlend.ingredientes.find(i => i.materialId === id)?.pct) || 0;
    const oldPct = (snapshot.ingredientes.find(i => i.materialId === id)?.pct) || 0;
    const diff = curPct - oldPct;
    const diffStr = diff > 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
    const color = diff > 0 ? 'var(--brand-matcha)' : diff < 0 ? 'var(--danger)' : 'var(--text-muted)';
    rows.push(`<div class="flex justify-between font-mono-num text-[10px] py-0.5">
      <span class="truncate pr-2">${mat.nombre}</span>
      <span>${oldPct.toFixed(1)}% → ${curPct.toFixed(1)}% (<strong style="color:${color}">${diffStr}</strong>)</span>
    </div>`);
  });
  return `<div class="mt-2 pt-2 border-t" style="border-color: var(--border-herbarium);">${rows.join('')}</div>`;
}

function updateIngredientPct(idx, newPct) {

function updateIngredientGrams(idx, newGrams) {

function updateLabDropdownHighlight() {
  const drop = document.getElementById('labBotanicalDropdown');
  if (!drop) return;
  const rows = drop.querySelectorAll('[data-lab-opt-idx]');
  rows.forEach((row, idx) => {
    row.style.backgroundColor = idx === labHighlightIdx ? 'var(--brand-matcha-soft)' : '';
    if (idx === labHighlightIdx) {
      row.scrollIntoView({ block: 'nearest' });
    }
  });
}


function handleLabBotanicalKeydown(e) {
  const drop = document.getElementById('labBotanicalDropdown');
  const matches = getFilteredLabBotanicals().slice(0, 45);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (drop && drop.classList.contains('hidden')) {
      openLabBotanicalDropdown();
      return;
    }
    if (matches.length > 0) {
      labHighlightIdx = (labHighlightIdx + 1) % matches.length;
      updateLabDropdownHighlight();
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (matches.length > 0) {
      labHighlightIdx = (labHighlightIdx - 1 + matches.length) % matches.length;
      updateLabDropdownHighlight();
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    confirmHighlightedLabBotanical();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (drop) drop.classList.add('hidden');
  }
}


function confirmHighlightedLabBotanical() {
  const matches = getFilteredLabBotanicals().slice(0, 45);
  if (matches.length === 0) {
    const inp = document.getElementById('labBotanicalSearchInput');
    if (inp) inp.focus();
    openLabBotanicalDropdown();
    showToast('Escribe el nombre de un botánico existente para incorporarlo.', 'warn');
    return;
  }
  const chosen = matches[labHighlightIdx] || matches[0];
  if (chosen) {
    selectAndAddBotanical(chosen.id);
  }
}


function selectAndAddBotanical(matId) {
  const mat = getMaterial(matId);
  if (!mat) return;
  const b = getActiveBlend();
  if (!b) return;
  if (b.ingredientes.some(i => i.materialId === matId)) {
    showToast(`"${mat.nombre}" ya forma parte de la fórmula activa.`, 'warn');
    return;
  }
  b.ingredientes.push({ materialId: matId, pct: 5 });
  state.labBotanicalSearch = '';
  labHighlightIdx = 0;
  saveState();
  renderCurrentTab();
  showToast(`✓ ${mat.nombre} incorporado al 5%.`);
}

function removeIngredientFromBlend(idx) {

}




function normalizeBlendPct() {
  const b = getActiveBlend();
  const sum = b.ingredientes.reduce((acc, i) => acc + (Number(i.pct) || 0), 0);
  if (sum <= 0) return;
  b.ingredientes.forEach(i => {
    i.pct = Number(((i.pct / sum) * 100).toFixed(2));
  });
  const newSum = b.ingredientes.reduce((acc, i) => acc + i.pct, 0);
  if (b.ingredientes.length > 0) {
    b.ingredientes[b.ingredientes.length - 1].pct = Number((b.ingredientes[b.ingredientes.length - 1].pct + (100 - newSum)).toFixed(2));
  }
  saveState();
  renderCurrentTab();
  showToast('Fórmula equilibrada exactamente al 100.00%.');
}

function confirmDeleteBlend() {
  if (state.blends.length <= 1) {
    confirmDeleteAndRecreateBlend();
    return;
  }
  const idx = state.blends.findIndex(x => x.id === state.activeBlendId);
  if (idx === -1) return;
  const deleted = state.blends[idx];
  state.blends.splice(idx, 1);
  const nextIdx = Math.max(0, idx - 1);
  state.activeBlendId = state.blends[nextIdx].id;
  state.compareVersionIdx = null;
  saveState();
  closeModal();
  renderGlobalBlendSelect();
  renderCurrentTab();
  showToast(`Composición "${deleted.nombre}" eliminada.`);
}


function confirmDeleteAndRecreateBlend() {
  const deleted = getActiveBlend();
  state.blends = [];
  state.compareVersionIdx = null;
  createNewBlend();
  closeModal();
  if (deleted) {
    showToast(`"${deleted.nombre}" eliminada. Nueva composición lista en mesa.`);
  }
}

function buildRadarSVG(profile, blend) {
  const size = 320;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 110;
  const levels = [2, 4, 6, 8, 10];
  const n = SENSORY_AXES.length;




  const getPoint = (idx, val) => {
    const angle = (Math.PI * 2 * idx) / n - Math.PI / 2;
    const r = (val / 10) * maxR;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  };




  const gridPolys = levels.map(lvl => {
    const pts = SENSORY_AXES.map((_, i) => getPoint(i, lvl).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--border-herbarium)" stroke-width="1"/>`;
  }).join('');




  const axesLines = SENSORY_AXES.map((ax, i) => {
    const [x2, y2] = getPoint(i, 10);
    const [lx, ly] = getPoint(i, 12.2);
    return `
      <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--border-herbarium)" stroke-width="1"/>
      <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="var(--text-secondary)" font-size="9.5" font-weight="600">${ax.label.split(' ')[0]}</text>
    `;
  }).join('');




  let comparePoly = '';
  if (state.compareVersionIdx !== null && blend.versiones && blend.versiones[state.compareVersionIdx]) {
    const snap = blend.versiones[state.compareVersionIdx];
    const tempBlend = { ...blend, ingredientes: snap.ingredientes };
    const oldProfile = analyzeBlend(tempBlend).sensoryProfile;
    const oldPts = SENSORY_AXES.map((ax, i) => getPoint(i, oldProfile[ax.key]).join(',')).join(' ');
    comparePoly = `<polygon points="${oldPts}" fill="rgba(166, 90, 56, 0.14)" stroke="var(--brand-clay)" stroke-width="1.8" stroke-dasharray="4 3"/>`;
  }




  const activePts = SENSORY_AXES.map((ax, i) => getPoint(i, profile[ax.key]).join(',')).join(' ');
  const dots = SENSORY_AXES.map((ax, i) => {
    const [px, py] = getPoint(i, profile[ax.key]);
    return `<circle cx="${px}" cy="${py}" r="3.5" fill="var(--brand-matcha)"/>`;
  }).join('');




  return `
    <svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[330px] h-auto">
      ${gridPolys}
      ${axesLines}
      ${comparePoly}
      <polygon points="${activePts}" fill="rgba(46, 82, 51, 0.22)" stroke="var(--brand-matcha)" stroke-width="2.2"/>
      ${dots}
    </svg>
  `;
}




function buildFlavorWheelSVG(autoNotes, stageNotes) {
  const size = 290;
  const cx = size / 2;
  const cy = size / 2;
  const rInner = 42;
  const rMid = 88;
  const rOuter = 132;
  const totalFams = FLAVOR_FAMILIES.length;




  let slices = '';
  FLAVOR_FAMILIES.forEach((fam, fIdx) => {
    const startA = (fIdx / totalFams) * Math.PI * 2 - Math.PI / 2;
    const endA = ((fIdx + 1) / totalFams) * Math.PI * 2 - Math.PI / 2;
    const midA = (startA + endA) / 2;




    const x1 = cx + rInner * Math.cos(startA), y1 = cy + rInner * Math.sin(startA);
    const x2 = cx + rMid * Math.cos(startA), y2 = cy + rMid * Math.sin(startA);
    const x3 = cx + rMid * Math.cos(endA), y3 = cy + rMid * Math.sin(endA);
    const x4 = cx + rInner * Math.cos(endA), y4 = cy + rInner * Math.sin(endA);




    const hasActive = fam.items.some(it => autoNotes.has(it) || stageNotes.includes(it));




    slices += `
      <path d="M ${x1} ${y1} L ${x2} ${y2} A ${rMid} ${rMid} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${rInner} ${rInner} 0 0 0 ${x1} ${y1}"
        fill="${fam.color}" fill-opacity="${hasActive ? '0.88' : '0.35'}" stroke="var(--bg-card)" stroke-width="1.5"/>
    `;




    const subCount = fam.items.length;
    fam.items.forEach((item, sIdx) => {
      const sStart = startA + (sIdx / subCount) * (endA - startA);
      const sEnd = startA + ((sIdx + 1) / subCount) * (endA - startA);
      const ox1 = cx + rMid * Math.cos(sStart), oy1 = cy + rMid * Math.sin(sStart);
      const ox2 = cx + rOuter * Math.cos(sStart), oy2 = cy + rOuter * Math.sin(sStart);
      const ox3 = cx + rOuter * Math.cos(sEnd), oy3 = cy + rOuter * Math.sin(sEnd);
      const ox4 = cx + rMid * Math.cos(sEnd), oy4 = cy + rMid * Math.sin(sEnd);




      const isSel = stageNotes.includes(item);
      const isAut = autoNotes.has(item);
      const opacity = isSel ? '0.96' : isAut ? '0.68' : '0.20';




      slices += `
        <path onclick="toggleStageNote('${item}')" style="cursor:pointer;"
          d="M ${ox1} ${oy1} L ${ox2} ${oy2} A ${rOuter} ${rOuter} 0 0 1 ${ox3} ${oy3} L ${ox4} ${oy4} A ${rMid} ${rMid} 0 0 0 ${ox1} ${oy1}"
          fill="${isSel ? '#A65A38' : fam.color}" fill-opacity="${opacity}" stroke="var(--bg-card)" stroke-width="1">
          <title>${fam.family}: ${item}</title>
        </path>
      `;
    });




    const tx = cx + ((rInner + rMid) / 2) * Math.cos(midA);
    const ty = cy + ((rInner + rMid) / 2) * Math.sin(midA);
    slices += `
      <text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="#FCF9F3" font-size="8" font-weight="700" pointer-events="none">
        ${fam.family.split(' ')[0]}
      </text>
    `;
  });




  return `
    <svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[290px] h-auto">
      ${slices}
      <circle cx="${cx}" cy="${cy}" r="${rInner - 2}" fill="var(--bg-card)" stroke="var(--border-herbarium)" stroke-width="1.5"/>
      <text x="${cx}" y="${cy - 3}" text-anchor="middle" fill="var(--brand-matcha)" font-size="8.5" font-weight="800">RUEDA</text>
      <text x="${cx}" y="${cy + 8}" text-anchor="middle" fill="var(--text-secondary)" font-size="7.5">BOTÁNICA</text>
    </svg>
  `;
}




function toggleStageNote(desc) {
  const b = getActiveBlend();
  if (!b.sinestesia) b.sinestesia = { liquorColor: 'honey', textura: 'Sedoso', momento: '', resonanciaEmocional: '', maridajes: [], notasEtapas: { seco: [], caliente: [], frio: [] } };
  if (!b.sinestesia.notasEtapas) b.sinestesia.notasEtapas = { seco: [], caliente: [], frio: [] };
  const arr = b.sinestesia.notasEtapas[state.sensoryStage];
  const idx = arr.indexOf(desc);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(desc);
  saveState();
  renderCurrentTab();
}




function updateSinestesia(field, val) {
  const b = getActiveBlend();
  if (!b.sinestesia) b.sinestesia = {};
  b.sinestesia[field] = val;
  saveState();
  renderCurrentTab();
}




function addMaridaje() {
  const inp = document.getElementById('newPairingInput');
  const val = inp?.value.trim();
  if (!val) return;
  const b = getActiveBlend();
  if (!b.sinestesia.maridajes) b.sinestesia.maridajes = [];
  b.sinestesia.maridajes.push(val);
  saveState();
  renderCurrentTab();
}




function removeMaridaje(idx) {
  const b = getActiveBlend();
  b.sinestesia.maridajes.splice(idx, 1);
  saveState();
  renderCurrentTab();
}

function getFilteredLibraryMaterials() {
  const q = normalizeSearchStr(state.librarySearch || '');
  return state.materials.filter(m => {
    if (state.libraryFilterCat !== 'Todas' && m.categoria !== state.libraryFilterCat) return false;
    if (state.libraryOnlyLowStock && m.stockG > m.stockMinG) return false;
    if (q) {
      const matchName = normalizeSearchStr(m.nombre).includes(q);
      const matchOrigin = normalizeSearchStr(m.origen || '').includes(q);
      const matchCat = normalizeSearchStr(m.categoria || '').includes(q);
      const matchNotes = m.notas.some(n => normalizeSearchStr(n).includes(q));
      const matchLote = normalizeSearchStr(m.lote || '').includes(q);
      if (!matchName && !matchOrigin && !matchCat && !matchNotes && !matchLote) return false;
    }
    return true;
  });
}

function saveMaterialFromModal(e, isNew) {
  e.preventDefault();
  const id = document.getElementById('m_id').value;
  const perfilSensorial = {};
  SENSORY_AXES.forEach(ax => {
    perfilSensorial[ax.key] = Number(document.getElementById(`m_sens_${ax.key}`).value) || 0;
  });




  const dosisRaw = document.getElementById('m_dosisMaxPct').value;
  const alergenoRaw = document.getElementById('m_alergeno').value.trim();




  const updated = {
    id,
    nombre: document.getElementById('m_nombre').value.trim(),
    categoria: document.getElementById('m_categoria').value,
    origen: document.getElementById('m_origen').value.trim(),
    tempC: Number(document.getElementById('m_tempC').value) || 85,
    tiempoSeg: Number(document.getElementById('m_tiempoSeg').value) || 180,
    teinaMgG: Number(document.getElementById('m_teinaMgG').value) || 0,
    densidad: Number(document.getElementById('m_densidad').value) || 0.3,
    costoKg: Number(document.getElementById('m_costoKg').value) || 0,
    stockG: Number(document.getElementById('m_stockG').value) || 0,
    stockMinG: Number(document.getElementById('m_stockMinG').value) || 100,
    lote: document.getElementById('m_lote').value.trim(),
    alergeno: alergenoRaw || null,
    dosisMaxPct: dosisRaw ? Number(dosisRaw) : null,
    notas: document.getElementById('m_notas').value.split(',').map(s => s.trim()).filter(Boolean),
    perfilSensorial
  };




  if (isNew) state.materials.push(updated);
  else {
    const idx = state.materials.findIndex(m => m.id === id);
    if (idx >= 0) state.materials[idx] = updated;
  }




  saveState();
  closeModal();
  renderCurrentTab();
  showToast('Espécimen botánico guardado en el herbario.');
}




function closeModal() {
  const backdrop = document.getElementById('modalBackdrop');
  backdrop.classList.add('hidden');
  backdrop.classList.remove('flex');
}

function recalcColdBrew() {
  const blend = getActiveBlend();
  const analysis = analyzeBlend(blend);
  const waterMl = Math.max(100, Number(document.getElementById('cb_waterMl')?.value) || 1000);
  const ratioGL = Number(document.getElementById('cb_profile')?.value) || 15;
  const teaGrams = (waterMl / 1000) * ratioGL;




  let hours = '8 – 10 h';
  let sweetnessProfile = 'Floral sedoso';
  if (analysis.optTempC <= 80) { hours = '6 – 8 h'; sweetnessProfile = 'Umami dulce'; }
  else if (analysis.optTempC >= 92) { hours = '12 – 16 h'; sweetnessProfile = 'Cacao y miel'; }




  const box = document.getElementById('cb_results');
  if (box) {
    box.innerHTML = `
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">HEBRAS BLEND</div>
        <div class="text-base font-bold mt-0.5" style="color: var(--brand-matcha);">${teaGrams.toFixed(1)} g</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">MACERACIÓN 4°C</div>
        <div class="text-base font-bold mt-0.5">${hours}</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">TANINOS</div>
        <div class="text-base font-bold mt-0.5">-68%</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">PERFIL DULZOR</div>
        <div class="text-xs font-editorial italic font-bold mt-1" style="color: var(--brand-clay);">${sweetnessProfile}</div>
      </div>
    `;
  }
}




function recalcSyrup() {
  const blend = getActiveBlend();
  const analysis = analyzeBlend(blend);
  const teaMl = Math.max(50, Number(document.getElementById('sy_teaMl')?.value) || 500);
  const brix = Math.min(68, Math.max(35, Number(document.getElementById('sy_brix')?.value) || 58));
  const acidType = document.getElementById('sy_acid')?.value || 'none';




  const sugarGrams = (brix * teaMl) / (100 - brix);
  const yieldMl = Math.round(teaMl + sugarGrams * 0.62);
  const blendGrams = (teaMl / 1000) * 25;
  const acidGrams = acidType === 'none' ? 0 : acidType === 'yuzu' ? (yieldMl * 0.06) : (yieldMl * 0.012);
  const totalCost = ((blendGrams / 1000) * analysis.costoKgBlend) + ((sugarGrams / 1000) * 1.8);




  const box = document.getElementById('sy_results');
  if (box) {
    box.innerHTML = `
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">INFUSIÓN / ENDULZ.</div>
        <div class="text-sm font-bold mt-0.5" style="color: var(--brand-clay);">${teaMl}ml / ${sugarGrams.toFixed(0)}g</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">ACIDULANTE</div>
        <div class="text-base font-bold mt-0.5">${acidGrams > 0 ? acidGrams.toFixed(1) + ' g' : '0 g'}</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">RENDIMIENTO</div>
        <div class="text-base font-bold mt-0.5">${yieldMl} ml</div>
      </div>
      <div>
        <div class="text-[10px]" style="color: var(--text-muted);">COSTO / 100 ML</div>
        <div class="text-base font-bold mt-0.5">${formatMoney((totalCost / yieldMl) * 100)}</div>
      </div>
    `;
  }
}

function setCuppingMode(mode) {
  pauseTimer();
  state.cuppingMode = mode;
  const blend = getActiveBlend();
  const analysis = analyzeBlend(blend);
  const sec = mode === 'occidental' ? analysis.optTimeSeg : (state.gongfuDurations[state.gongfuStep] || 15);
  timerTotalSec = sec;
  timerRemainingSec = sec;
  renderCurrentTab();
}




function selectGongfuStep(idx) {
  pauseTimer();
  state.gongfuStep = idx;
  timerTotalSec = state.gongfuDurations[idx] || 15;
  timerRemainingSec = timerTotalSec;
  renderCurrentTab();
}




function updateGongfuDuration(idx, val) {
  const sec = Math.max(5, Math.min(600, Number(val) || 15));
  state.gongfuDurations[idx] = sec;
  saveState();
  selectGongfuStep(idx);
}




function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    timerRunning = true;
    const btn = document.getElementById('timerStartBtn');
    if (btn) btn.textContent = 'Pausar';
    timerInterval = setInterval(() => {
      if (timerRemainingSec > 0) {
        timerRemainingSec--;
        const disp = document.getElementById('timerDisplay');
        const bar = document.getElementById('timerProgressBar');
        if (disp) disp.textContent = formatSeconds(timerRemainingSec);
        if (bar) bar.style.width = `${((timerTotalSec - timerRemainingSec) / timerTotalSec) * 100}%`;
      } else {
        pauseTimer();
        playSingingBowl(false);
        showToast('Infusión completada. Decantar el licor.', 'info');
      }
    }, 1000);
  }
}




function pauseTimer() {
  timerRunning = false;
  if (timerInterval) clearInterval(timerInterval);
  const btn = document.getElementById('timerStartBtn');
  if (btn) btn.textContent = 'Iniciar Infusión';
}




function resetTimer() {
  pauseTimer();
  timerRemainingSec = timerTotalSec;
  renderCurrentTab();
}




function playSingingBowl(forcePlay) {
  if (timerMuted && !forcePlay) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const freqs = [432, 864, 1296];
    freqs.forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.18 / (idx + 1), now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 2.9);
    });
  } catch (e) {
    console.warn('Web Audio API no disponible:', e);
  }
}




function updateCuppingLiveScore() {
  const keys = [
    { id: 'hebra', max: 15 },
    { id: 'aroma', max: 20 },
    { id: 'color', max: 15 },
    { id: 'sabor', max: 30 },
    { id: 'retrogusto', max: 20 }
  ];
  let sum = 0;
  keys.forEach(k => {
    const el = document.getElementById(`cp_${k.id}`);
    const val = el ? Number(el.value) : 0;
    sum += val;
    const lbl = document.getElementById(`cp_val_${k.id}`);
    if (lbl) lbl.textContent = `${val}/${k.max}`;
  });
  const totEl = document.getElementById('cuppingTotalScore');
  if (totEl) totEl.textContent = `${sum} / 100`;
}

function applyPackagingPreset(val) {
  const [gStr, fmt] = val.split('|');
  const b = getActiveBlend();
  b.escandallo.pesoUnidadG = Number(gStr);
  b.escandallo.formato = fmt;
  saveState();
  renderCurrentTab();
}




function updateEscandallo(field, val) {
  const b = getActiveBlend();
  b.escandallo[field] = Number(val) || 0;
  saveState();
  renderCurrentTab();
}




function copyLabelToClipboard() {
  const box = document.getElementById('legalLabelBox');
  if (!box) return;
  box.select();
  document.execCommand('copy');
  showToast('Contraetiqueta legal copiada al portapapeles.');
}




function executeProductionOrder() {
  const b = getActiveBlend();
  const targetG = Math.max(1, Number(document.getElementById('prodBatchGrams')?.value) || b.batchSizeG);
  const tempBlend = { ...b, batchSizeG: targetG };
  const analysis = analyzeBlend(tempBlend);




  const faltantes = analysis.items.filter(it => it.mat && it.mat.stockG < it.gramos);
  if (faltantes.length > 0) {
    showToast(`Reserva insuficiente de: ${faltantes.map(f => f.mat.nombre).join(', ')}`, 'error');
    return;
  }




  analysis.items.forEach(it => {
    if (it.mat) {
      it.mat.stockG = Math.max(0, Number((it.mat.stockG - it.gramos).toFixed(2)));
    }
  });




  const totalCost = (targetG / 1000) * analysis.costoKgBlend;
  state.productionLogs.unshift({
    id: 'prod-' + Date.now(),
    fecha: new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }),
    blendName: `${b.codigo} — ${b.nombre}`,
    grams: targetG,
    cost: totalCost
  });




  saveState();
  renderCurrentTab();
  showToast(`Partida de ${targetG} g confirmada. Inventario de herbario actualizado.`);
}

function exportJSON() {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `INFUSIO_ATELIER_Archivo_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Archivo JSON del Atelier descargado.');
}




function importJSON(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.materials && imported.blends) {
        state = { ...state, ...imported };
        saveState();
        applyTheme(state.theme);
        renderGlobalBlendSelect();
        renderCurrentTab();
        showToast('Archivo del Atelier importado correctamente.');
      } else {
        showToast('El archivo JSON no corresponde a INFUSIO ATELIER.', 'error');
      }
    } catch (err) {
      showToast('Error al procesar el archivo JSON.', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}




function exportCSV() {
  const b = getActiveBlend();
  const analysis = analyzeBlend(b);
  const lines = [
    ['Codigo', 'Blend', 'Botanico', 'Familia', 'Origen', 'Porcentaje_%', 'Gramos_Lote', 'Temp_C', 'Tiempo_Seg', 'Densidad_g_cm3', 'Costo_Lote'].join(',')
  ];
  analysis.items.forEach(it => {
    if (!it.mat) return;
    const cost = (it.gramos / 1000) * it.mat.costoKg;
    lines.push([
      `"${b.codigo}"`,
      `"${b.nombre}"`,
      `"${it.mat.nombre}"`,
      `"${it.mat.categoria}"`,
      `"${it.mat.origen || ''}"`,
      it.pct.toFixed(2),
      it.gramos.toFixed(2),
      it.mat.tempC,
      it.mat.tiempoSeg,
      it.mat.densidad,
      cost.toFixed(2)
    ].join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${b.codigo}_Formula_InfusioAtelier.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Fórmula ${b.codigo} exportada a CSV.`);
}

function formatSeconds(sec) {
  const s = Math.max(0, Math.round(sec));
  const mins = Math.floor(s / 60);
  const rem = s % 60;
  return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
}




function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  const aw = Math.min(0.82, Math.max(0.28, 0.34 + (state.alcHumidity - 40) * 0.0045 + (hasHygro ? 0.09 : 0)));
  const pkgMult = state.alcPkgType === 'tin' ? 1.25 : state.alcPkgType === 'doypack' ? 1.15 : 0.6;
  const shelfMonths = Math.max(3, Math.min(24, Math.round(((0.68 - aw) * 56) * pkgMult)));




  container.innerHTML = `

function buildKineticSVG() {
  const tNorm = (state.alcTempC - 60) / 40;
  const gMult = state.alcGrade === 'dust' ? 1.55 : state.alcGrade === 'broken' ? 1.25 : 1.0;
  const wMult = state.alcWater === 'dura' ? 0.82 : state.alcWater === 'blanda' ? 1.08 : 1.0;




  const w = 600, h = 210, pL = 36, pR = 16, pT = 16, pB = 26;
  const pw = w - pL - pR, ph = h - pT - pB;




  const pThea = [], pCaff = [], pTan = [];
  for (let t = 0; t <= 10; t += 0.5) {
    const x = pL + (t / 10) * pw;
    const vThea = Math.min(98, 100 * (1 - Math.exp(-(0.55 + tNorm * 0.45) * gMult * t)));
    const vCaff = Math.min(96, 100 * (1 - Math.exp(-(0.22 + tNorm * 0.48) * gMult * t)));
    const vTan = Math.min(98, 100 * (1 - Math.exp(-(0.08 + Math.pow(tNorm, 1.45) * 0.45) * gMult * wMult * Math.pow(t, 1.1))));




    pThea.push(`${x.toFixed(1)},${(pT + ph - (vThea / 100) * ph).toFixed(1)}`);
    pCaff.push(`${x.toFixed(1)},${(pT + ph - (vCaff / 100) * ph).toFixed(1)}`);
    pTan.push(`${x.toFixed(1)},${(pT + ph - (vTan / 100) * ph).toFixed(1)}`);
  }




  const optStart = state.alcGrade === 'dust' ? 1.2 : state.alcGrade === 'broken' ? 2.0 : 2.6;
  const optEnd = optStart + 1.6;
  const x1 = pL + (optStart / 10) * pw;
  const x2 = pL + (optEnd / 10) * pw;




  let grid = '';
  for (let p = 0; p <= 100; p += 25) {
    const y = pT + ph - (p / 100) * ph;
    grid += `<line x1="${pL}" y1="${y}" x2="${w - pR}" y2="${y}" stroke="var(--border-herbarium)" stroke-dasharray="3 3"/>
             <text x="${pL - 5}" y="${y + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${p}%</text>`;
  }
  for (let m = 0; m <= 10; m += 2) {
    const x = pL + (m / 10) * pw;
    grid += `<text x="${x}" y="${h - 7}" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${m}m</text>`;
  }




  return `
    <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto rounded-xl border" style="background-color: var(--bg-parchment); border-color: var(--border-herbarium);">
      ${grid}
      <rect x="${x1}" y="${pT}" width="${x2 - x1}" height="${ph}" fill="var(--brand-matcha)" fill-opacity="0.12"/>
      <text x="${(x1 + x2) / 2}" y="${pT + 11}" text-anchor="middle" fill="var(--brand-matcha)" font-size="8.5" font-weight="700">VENTANA ÓPTIMA</text>
      <polyline fill="none" stroke="var(--brand-matcha)" stroke-width="2.4" points="${pThea.join(' ')}"/>
      <polyline fill="none" stroke="var(--brand-brass)" stroke-width="2.4" points="${pCaff.join(' ')}"/>
      <polyline fill="none" stroke="var(--brand-clay)" stroke-width="2.4" points="${pTan.join(' ')}"/>
    </svg>
  `;
}




function injectChord(chordId) {
  const ch = state.chords.find(x => x.id === chordId);
  const b = getActiveBlend();
  if (!ch || !b) return;
  const targetPct = Math.max(1, Math.min(80, Number(state.alcChordPct) || 15));
  const rem = (100 - targetPct) / 100;




  b.ingredientes.forEach(i => { i.pct = Number((i.pct * rem).toFixed(2)); });
  ch.items.forEach(ci => {
    const add = Number(((ci.pct / 100) * targetPct).toFixed(2));
    const ex = b.ingredientes.find(i => i.materialId === ci.materialId);
    if (ex) ex.pct = Number((ex.pct + add).toFixed(2));
    else b.ingredientes.push({ materialId: ci.materialId, pct: add });
  });
  saveState();
  switchTab('lab');
  showToast(`Acorde "${ch.name}" (${targetPct}%) inyectado en la Mesa de Blending.`);
}

function saveNewChord(e) {
  e.preventDefault();
  const raw = [];
  for (let i = 0; i < 4; i++) {
    const mid = document.getElementById(`nc_m_${i}`).value;
    const pct = Number(document.getElementById(`nc_p_${i}`).value) || 0;
    if (mid && pct > 0) raw.push({ materialId: mid, pct });
  }
  if (raw.length < 2) {
    showToast('Selecciona al menos 2 botánicos.', 'warn');
    return;
  }
  const sum = raw.reduce((s, x) => s + x.pct, 0);
  state.chords.unshift({
    id: 'ch-' + Date.now(),
    name: document.getElementById('nc_name').value.trim(),
    desc: document.getElementById('nc_desc').value.trim(),
    items: raw.map(x => ({ materialId: x.materialId, pct: Math.round((x.pct / sum) * 100) }))
  });
  saveState();
  closeModal();
  renderCurrentTab();
  showToast('Acorde botánico guardado.');
}

// MÓDULO 09: BIO-EFECTOS EN EL CUERPO, NEUROLOGÍA & PROTOCOLO DE SERVICIO
// ============================================================================
function evaluateBotanicalBioProfile(mat) {
  const n = (mat.nombre || '').toLowerCase();
  const cat = mat.categoria || '';
  const sens = mat.perfilSensorial || {};
  let digestivo = 2, antioxidante = 3, termogenico = 1, inmunologico = 2, relajante = 2;
  let lTheanineMgG = 0;




  if (cat === 'Blanco') {
    antioxidante = 9.5; digestivo = 4; relajante = 6; lTheanineMgG = 14;
  } else if (cat === 'Verde') {
    antioxidante = 10; digestivo = 5; relajante = 7;
    lTheanineMgG = (n.includes('gyokuro') || n.includes('matcha') || n.includes('kabusecha') || n.includes('anji')) ? 24 : 15;
  } else if (cat === 'Oolong') {
    antioxidante = 8; digestivo = 7.5; relajante = 5;
    lTheanineMgG = n.includes('gaba') ? 18 : 11;
  } else if (cat === 'Negro') {
    antioxidante = 7; termogenico = 6; digestivo = 5; lTheanineMgG = 7;
  } else if (cat === 'Pu-erh') {
    digestivo = 9.5; termogenico = 6; antioxidante = 6.5; lTheanineMgG = 6;
  } else if (cat === 'Tisana / Sin Teína') {
    antioxidante = 7; digestivo = 6; relajante = 6;
    if (n.includes('rooibos') || n.includes('honeybush')) { antioxidante = 8.5; relajante = 7.5; }
    if (n.includes('mate') || n.includes('guayusa') || n.includes('yaupon')) { termogenico = 7.5; lTheanineMgG = n.includes('guayusa') ? 8 : 2; }
    if (n.includes('carqueja') || n.includes('lapacho')) { digestivo = 8.5; inmunologico = 7; }
  } else if (cat === 'Flores y Hierbas') {
    relajante = 7; digestivo = 6; inmunologico = 5;
    if (n.includes('menta') || n.includes('peperina') || n.includes('poleo') || n.includes('burrito') || n.includes('cedrón') || n.includes('muña') || n.includes('incayuyo')) {
      digestivo = 9.5; relajante = 6;
    }
    if (n.includes('manzanilla') || n.includes('tilo') || n.includes('melisa') || n.includes('lavanda') || n.includes('pasiflora') || n.includes('marcela')) {
      relajante = 9.5; digestivo = 8;
    }
    if (n.includes('eucalyptus') || n.includes('tomillo') || n.includes('romero') || n.includes('tulsi') || n.includes('saúco') || n.includes('laurel')) {
      inmunologico = 9.5; termogenico = 6;
    }
    if (n.includes('hibisco')) { antioxidante = 9; inmunologico = 7; }
  } else if (cat === 'Especias y Raíces') {
    termogenico = 8.5; digestivo = 8; inmunologico = 7;
    if (n.includes('valeriana') || n.includes('ashwagandha') || n.includes('malvavisco')) {
      relajante = 9.5; termogenico = 2;
    }
    if (n.includes('ginseng') || n.includes('galanga') || n.includes('jengibre') || n.includes('canela') || n.includes('pimienta')) {
      termogenico = 9.5; inmunologico = 8;
    }
    if (n.includes('hinojo') || n.includes('anís') || n.includes('regaliz') || n.includes('cardamomo') || n.includes('diente de león') || n.includes('bardana')) {
      digestivo = 9.5;
    }
    if (n.includes('cúrcuma') || n.includes('equinácea')) {
      inmunologico = 9.5; antioxidante = 9;
    }
  } else if (cat === 'Frutas y Gourmand') {
    antioxidante = 7.5; inmunologico = 6;
    if (n.includes('escaramujo') || n.includes('yuzu') || n.includes('limón') || n.includes('naranja') || n.includes('pomelo') || n.includes('arándano') || n.includes('frambuesa')) {
      inmunologico = 8.5; antioxidante = 9;
    }
    if (n.includes('cacao') || n.includes('algarroba') || n.includes('dátil') || n.includes('higo')) {
      relajante = 6.5; termogenico = 5;
    }
  } else if (cat === 'Aceites Esenciales') {
    digestivo = 7; relajante = 7; inmunologico = 7;
  }




  return {
    digestivo,
    antioxidante,
    termogenico,
    inmunologico,
    relajante,
    lTheanineMgG
  };
}




function analyzeBioAndService(blend, analysis) {
  let digestivo = 0, antioxidante = 0, termogenico = 0, inmunologico = 0, relajante = 0;
  let lTheaninePerGram = 0;
  const norm = analysis.totalPct > 0 ? (100 / analysis.totalPct) : 0;




  const warnings = [];
  const highlights = [];




  analysis.items.forEach(it => {
    if (!it.mat || it.pct <= 0) return;
    const w = (it.pct / 100) * norm;
    const bio = evaluateBotanicalBioProfile(it.mat);
    digestivo += bio.digestivo * w;
    antioxidante += bio.antioxidante * w;
    termogenico += bio.termogenico * w;
    inmunologico += bio.inmunologico * w;
    relajante += bio.relajante * w;
    lTheaninePerGram += bio.lTheanineMgG * w;




    const nl = it.mat.nombre.toLowerCase();
    if (nl.includes('regaliz') && it.pct >= 4) {
      warnings.push('Contiene raíz de regaliz (glicirricina): moderar consumo en personas con hipertensión arterial.');
    }
    if ((nl.includes('hibisco') || nl.includes('karkadé')) && it.pct >= 12) {
      warnings.push('Alta proporción de hibisco: acidez málica marcada; evitar en ayunas si existe gastritis o sensibilidad gástrica.');
    }
    if (nl.includes('valeriana') || nl.includes('pasiflora') || nl.includes('loto azul')) {
      warnings.push('Botánicos sedantes del SNC: evitar combinar con alcohol o conducir tras dosis concentradas.');
    }
    if (nl.includes('ginseng') || nl.includes('guayusa') || nl.includes('mate')) {
      warnings.push('Estimulante xantínico/adaptógeno: consumir preferentemente antes de las 16:00 h.');
    }
  });




  const caffCup = analysis.teinaPorTaza;
  const theaCup = lTheaninePerGram * 2.5;




  if (caffCup >= 35) {
    warnings.push(`Carga alta de teína (${caffCup.toFixed(0)} mg/taza): puede interferir con el sueño si se toma después de las 17:00 h; separar 45 min de comidas ricas en hierro.`);
  } else if (caffCup === 0) {
    highlights.push('100% libre de teína/cafeína: apto para consumo nocturno, niños y personas sensibles a estimulantes.');
  }




  // Estado Psicológico / Neurológico
  let neuroTitle = 'Equilibrio Sensorial Neutro';
  let neuroBadge = 'Armonía Botánica';
  let neuroDesc = 'Fórmula balanceada sin picos bruscos de estimulación ni sedación.';
  let bestWindow = 'Todo el día (09:00 – 20:00)';
  let contexts = ['Pausa consciente de media tarde', 'Acompañamiento de lectura ligera'];




  if (caffCup >= 28 && theaCup >= 25) {
    neuroTitle = 'Alerta Serena & Enfoque Alfa (Sinergia L-Teanina : Cafeína)';
    neuroBadge = 'Foco Cognitivo Sostenido';
    neuroDesc = 'La L-teanina cruza la barrera hematoencefálica promoviendo ondas cerebrales Alfa mientras suaviza el pico de adenosina de la cafeína. Genera concentración limpia, lucidez y calma mental sin taquicardia.';
    bestWindow = 'Mañana y Media Tarde (08:00 – 16:30)';
    contexts = ['Estudio profundo o trabajo creativo', 'Reuniones estratégicas', 'Meditación activa'];
  } else if (caffCup >= 28 && theaCup < 25) {
    neuroTitle = 'Activación Vigorosa & Estímulo Dopaminérgico';
    neuroBadge = 'Energía Física y Mental';
    neuroDesc = 'Predominio de cafeína/teobromina y polifenoles oxidados que incrementan el estado de vigilia, la termogénesis y el tono simpático. Ideal para iniciar la jornada con vigor.';
    bestWindow = 'Mañana y Sobremesa Temprana (07:00 – 15:00)';
    contexts = ['Desayuno energético', 'Activación previa a ejercicio suave', 'Sobremesa laboral'];
  } else if (caffCup > 0 && caffCup < 28 && theaCup >= 18) {
    neuroTitle = 'Claridad Contemplativa & Reducción de Estrés';
    neuroBadge = 'Calma Lúcida';
    neuroDesc = 'Baja carga de teína acompañada de aminoácidos relajantes y terpenos florales/herbacéos (linalol, geraniol) que reducen el cortisol percibido manteniendo claridad.';
    bestWindow = 'Media Mañana a Tarde (10:00 – 19:00)';
    contexts = ['Tarde de lectura o escritura', 'Transición post-trabajo', 'Cata sensorial pausada'];
  } else if (caffCup === 0 && relajante >= 6.5) {
    neuroTitle = 'Descompresión Parasimpática & Modulación GABA';
    neuroBadge = 'Relajación Profunda';
    neuroDesc = 'Flavonoides (apigenina, vitexina) y aceites esenciales sedantes favorecen la actividad del neurotransmisor GABA, disminuyendo la tensión neuromuscular y preparando el descanso.';
    bestWindow = 'Tarde-Noche y Pre-Sueño (19:30 – 23:30)';
    contexts = ['Ritual nocturno antes de dormir', 'Alivio de estrés acumulado', 'Post-cena tardía'];
  } else if (caffCup === 0 && digestivo >= 7) {
    neuroTitle = 'Confort Visceral & Despeje Sensorial';
    neuroBadge = 'Bienestar Digestivo';
    neuroDesc = 'Aceites esenciales carminativos (mentol, citral, anetol, gingeroles) relajan el músculo liso gastrointestinal y despejan la fatiga postprandial.';
    bestWindow = 'Post-Almuerzo y Post-Cena';
    contexts = ['Digestivo tras comidas copiosas', 'Refresco mental sin cafeína'];
  }




  // Protocolo de Servicio: Solo vs Leche vs Syrup
  const sp = analysis.sensoryProfile;
  const isAcidic = sp.acidez >= 5.0;
  const isRobust = sp.cuerpo >= 6.5 && (sp.astringencia >= 4.0 || sp.tostado >= 5.5 || sp.especiado >= 5.5);
  const isDelicate = (sp.floral >= 6.0 || sp.vegetal >= 6.5) && sp.cuerpo <= 6.0 && sp.tostado <= 3.0;
  const isNaturallySweet = sp.dulzor >= 7.5;




  // 1. Solo en agua
  let soloStatus = 'Ideal';
  let soloColor = 'var(--brand-matcha)';
  let soloNote = `Infusionar puro a ${analysis.optTempC}°C durante ${formatSeconds(analysis.optTimeSeg)} en agua mineral de baja mineralización (50–90 ppm) para expresar su arquitectura aromática completa.`;
  if (isRobust && sp.astringencia >= 6.5) {
    soloStatus = 'Recomendado (Taza Intensa)';
    soloNote = `Expresa carácter tánico y maltoso pleno a ${analysis.optTempC}°C. Controlar estrictamente el tiempo (${formatSeconds(analysis.optTimeSeg)}) para evitar sobre-extracción.`;
  }




  // 2. Con Leche o Bebida Vegetal
  let milkStatus = 'Opcional';
  let milkColor = 'var(--brand-brass)';
  let milkType = 'Bebida vegetal de avena o almendra suave';
  let milkNote = 'Acepta un toque lácteo ligero, aunque puro conserva mayor nitidez aromática.';




  if (isAcidic) {
    milkStatus = 'No Recomendado (Riesgo de Corte)';
    milkColor = 'var(--danger)';
    milkType = 'Evitar lácteos (acidez ≥ 5/10 flocula la caseína)';
    milkNote = 'La presencia de ácidos orgánicos cítricos o málicos (hibisco/frutas) corta la leche animal. Si deseas cremosidad, usa únicamente bebida vegetal de coco o avena en frío.';
  } else if (isRobust) {
    milkStatus = 'Altamente Recomendado';
    milkColor = 'var(--brand-matcha)';
    milkType = sp.especiado >= 5 ? 'Leche entera cremosa o Bebida de Avena Barista (60–65°C)' : 'Leche entera, Avena Barista o Leche de Coco';
    milkNote = 'Los polifenoles y notas tostadas/especiadas se ensamblan con las proteínas y grasas lácteas creando un Tea Latte sedoso y envolvente (infusionar concentrado al doble de dosis: 5 g / 200 ml).';
  } else if (isDelicate) {
    milkStatus = 'Desaconsejado (Enmascara Notas)';
    milkColor = 'var(--text-muted)';
    milkType = 'Servir puro sin lácteos';
    milkNote = 'Las grasas lácteas recubren las papilas y ocultan los compuestos volátiles florales, frutales y el umami delicado de esta hebra.';
  }




  // 3. Con Syrup, Miel o Endulzante
  let syrupStatus = 'Opcional a Gusto';
  let syrupColor = 'var(--brand-brass)';
  let syrupRec = 'Miel silvestre multifloral o sin endulzar';
  let syrupNote = 'Un toque mínimo (5–8 ml) puede redondear bordes sin tapar la base.';




  if (isNaturallySweet && !isAcidic) {
    syrupStatus = 'Sin Endulzar (Dulzor Natural Alto)';
    syrupColor = 'var(--brand-matcha)';
    syrupRec = 'Ninguno — disfrutar su huigan (dulzor residual) natural';
    syrupNote = 'La fórmula ya posee un índice de dulzor sensorial alto; añadir azúcar o jarabes restaría complejidad.';
  } else if (isAcidic) {
    syrupStatus = 'Muy Recomendado (Equilibrio Ácido-Dulce)';
    syrupColor = 'var(--brand-clay)';
    syrupRec = 'Miel cruda de azahar, Sirope de Agave o Cordial de Flor de Saúco (10–15 ml)';
    syrupNote = 'El dulzor floral equilibra la acidez brillante del hibisco o los cítricos, tanto en servicio caliente como en Iced Tea.';
  } else if (sp.especiado >= 5.5 || sp.tostado >= 6.0) {
    syrupStatus = 'Recomendado para Latte / Barra';
    syrupColor = 'var(--brand-clay)';
    syrupRec = 'Sirope de Vainilla Bourbon, Miel de Bosque o Sirope de Panela & Jengibre';
    syrupNote = 'Potencia las notas de cacao, malta y especias cálidas; ideal para preparar Tea Lattes o mocktails en el Módulo 04.';
  } else if (sp.floral >= 6.0) {
    syrupStatus = 'Toque Sutil Opcional';
    syrupColor = 'var(--brand-brass)';
    syrupRec = 'Miel de Acacia pura o Sirope ligero de Azahar (máx. 5 ml)';
    syrupNote = 'La miel de acacia tiene bajo índice aromático invasivo y actúa como puente para notas de jazmín, rosa u osmanthus.';
  }




  return {
    physio: [
      { key: 'digestivo', label: 'Digestivo & Carminativo', val: Math.min(10, digestivo), color: 'var(--brand-matcha)' },
      { key: 'antioxidante', label: 'Antioxidante & Celular', val: Math.min(10, antioxidante), color: '#3B7A57' },
      { key: 'termogenico', label: 'Termogénico & Circulatorio', val: Math.min(10, termogenico), color: 'var(--brand-clay)' },
      { key: 'inmunologico', label: 'Inmunológico & Respiratorio', val: Math.min(10, inmunologico), color: 'var(--brand-brass)' },
      { key: 'relajante', label: 'Relajante & Antiinflamatorio', val: Math.min(10, relajante), color: '#6E648C' }
    ],
    caffCup,
    theaCup,
    neuroTitle,
    neuroBadge,
    neuroDesc,
    bestWindow,
    contexts,
    warnings,
    highlights,
    service: {
      solo: { status: soloStatus, color: soloColor, note: soloNote },
      milk: { status: milkStatus, color: milkColor, type: milkType, note: milkNote },
      syrup: { status: syrupStatus, color: syrupColor, rec: syrupRec, note: syrupNote }
    }
  };
}
